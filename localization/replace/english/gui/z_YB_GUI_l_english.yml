l_english:

# Game Concepts
 #game_concept_people: "People"
 #game_concept_peoples: "Peoples"
 #game_concept_human: "Human"
 #game_concept_humans: "Humans"
 #game_concept_population: "Population"
 #game_concept_populations: "Populations"
 #game_concept_people_desc: "$game_concept_people$ represent the general [population|E] living within a [county|E] or [realm|E]. They are influenced by factors such as [culture|E] and [faith|E], shaping their overall opinion of their rulers. The contentment of the $game_concept_people$ is reflected by their opinion, which can be affected by religious alignment, [cultural|E] differences, taxation and levies, wars and raids, as well as events and policies. Counties following a different [faith|E] than their ruler may experience unrest, while [cultural|E] mismatches can reduce acceptance. High taxes and levies can decrease opinion, while lenient policies may improve it. Frequent warfare, occupation, or raids can cause discontent, and certain decisions and events can sway the $game_concept_people$'s loyalty. A county with low opinion is more prone to revolts and can attract [factions|E] seeking independence or a change in leadership. Keeping the $game_concept_people$ content is essential for a stable and prosperous rule."

 #game_concept_ancestral_communities: "Ancestral Communities"
 #game_concept_ancestral_community: "Ancestral Community" # Yusseter: 'Atasal Topluluk'
 #game_concept_ancestral_community_desc: "The $game_concept_ancestral_communities$ is a historically significant peoples who once thrived as a distinct [cultural|E] or societal groups. These communities formed the foundation of their time, shaping their surroundings through their way of life, [traditions|E], and societal structures. They were not merely contributors to history but living embodiments of their [era|E], defining their [regions|E] through their customs, beliefs, and interactions with others.\n\nEach $game_concept_ancestral_community$ had its own identity, shaped by its environment and historical circumstances. Some flourished as [independent|E] groups, while others became part of larger civilizations over time. Regardless of their fate, they played a crucial role in the historical and [cultural|E] [development|E] of the [regions|E] they inhabited.\n\nEven if an $game_concept_ancestral_community$ no longer exists as a distinct group, its legacy endures in the form of [traditions|E], historical accounts, and [cultural|E] influences. They remain a key part of understanding the past, serving as a bridge between ancient societies and the world that followed them."

 game_concept_organized_faith: "$game_concept_organized$ $game_concept_faith$"

 game_concept_romanobrittonic: "$britano_roman$"
 game_concept_romanobrit: "$britano_roman$"
 game_concept_romano_briton: "$britano_roman_collective_noun$"
 game_concept_romano_briton_main: ""
 game_concept_romano_briton_main_desc: "#F The $britano_roman_collective_noun$, or simply $briton_collective_noun$, were the varyingly Romanized $old_brythonic$ who inhabited Britannia until the Vth century when the province gradually fell into a military anarchy due to $pictish$, $irish$ and $old_saxon$ raids.\n\nWhen Rome finally gave up Britain around the year 440, opportunistic British warlords established their own Kingdoms utilizing $germanic_noun$ mercenaries who often tended to usurp leadership for themselves. \nIn some cases however, the ruling elite seems to have maintained itself and simply got assimilated by their retinues over the centuries.\n\nBy the VIIth century, the $briton_collective_noun$ have either been culturally assimilated into new $anglo_saxon$ groups, or have gradually evolved into the various $brythonic$ peoples.#!"

 game_concept_briton: "$briton_noun$"
 game_concept_britons: "$briton_collective_noun$"
 game_concept_britannian: "$britannian_noun$"
 game_concept_britannians: "$britannians$"
 game_concept_oldbrit: "$old_brythonic$"
 game_concept_old_briton: "$old_brythonic_collective_noun$"
 game_concept_old_briton_main: ""
 game_concept_old_briton_main_desc: "#F The $old_brythonic_collective_noun$ were the original inhabitants of the island of Britain prior to the $roman$ conquest. \n\nAfter Claudius' Invasion, the island was gradually integrated into the wider $roman$ world, leading to the steady $roman$ization of the $old_brythonic_collective_noun$ within the province while those beyond the walls to the north would eventually evolve into the ancestors of the $picts$. \n\nWhile the original $old_brythonic_collective_noun$ are long gone, their language, as well as aspects of their culture, survive in the later $britano_roman$ and $pictish$ traditions#!"

 game_concept_anglosaxon: "$anglo_saxon$"
 game_concept_anglosaxons: "$anglo_saxon_collective_noun$"
 game_concept_anglosaxons: "Anglian and $old_saxon$"
 game_concept_anglosaxons_main: ""
 game_concept_anglosaxons_main_desc: "#F The $game_concept_anglosaxons$ were a collection of Angelic speaking peoples that inhabited Britain since the Sub-$roman$ Period from Vth century onward. \n\nDescending from the assimilated $britano_roman_collective_noun$ and various $germanic_noun$ mercenaries groups, they were never a truly unified force. However, due to the efforts of writers like Bede, the Angelic speaking inhabitants of the many $germanic_noun$ kingdoms would gradually develop a common Angelcynn identity that distinguished itself from the $frankish_collective_noun$ on the mainland and Brittonic speaking $britano_roman_collective_noun$ of Wales and Cornwall#!"
 game_concept_anglosaxons_main_desc: "#F In the late IXth and early Xth centuries, the kings of Wessex defeated the Danes and liberated the Angles from the Danelaw. They united their house in marriage with the surviving Angle royalty, and were accepted by the Angles as their kings. This marked the passing of the old $anglo_saxon$ world and the dawn of the 'English' as a new people."

 game_concept_oldslavic: "$slavic$"
 game_concept_old_slavs: "$slavic_collective_noun$"
 game_concept_old_slavs_main: ""
 game_concept_old_slavs_main_desc: "#F The $slavic_collective_noun$ are the ancestors of the many $slavic$ peoplesthat came to inhabit much of Eastern Europe starting in the VIth century.\n\nWhile the exact origin and ethnogenesis of the $slavic_collective_noun$ remains a mystery even to the present day, a likely homeland for these Old $slavic_collective_noun$ rests within the Podlasia region between Ukraine and Belarus from where these $slavic_collective_noun$ would start to migrate East, South and West into Ruthenia, Poland, Eastern Germany, Pannonia and the Balkans. While it is most likely that many $slavic$ peoplescan trace their origin to pre-existing peoples that would come to be assimilated because of these $slavic$ migrations, they nevertheless considered themselves, and were considered by their neighbours, to, more or less, constitute a single people even up until the early modern period.\n\nIn the game, the $slavic_collective_noun$ are the ancestral culture of the various $heritage_east_slavic_name$, $heritage_west_slavic_name$ and $heritage_south_slavic_name$ and Pannonian $slavic$ peoples.#!"

 game_concept_antean: "Antean"
 game_concept_anteans: "Anteans"
 game_concept_eastslavic: "East $slavic$"
 game_concept_east_slavs: "East $slavic_collective_noun$"
 game_concept_east_slavs_main: ""
 game_concept_east_slavs_main_desc: "#F The East $slavic_collective_noun$, also known as the Rus or Ruthenians, are the descendants of the $slavic_collective_noun$ who migrated east from their ancestral homeland of Podlasia.\n\nSettling in the Pontic Steppe and the formerly Baltic and Finno-Ugric lands to the north, these East $slavic_collective_noun$ would gradually fall under the influence of North $germanic_noun$, Varangian raiders, as well as under Byzantine influence that gradually spread northwards from the Black Sea. By the IXth century, the East $slavic_collective_noun$ were divided into various tribes who were varyingly influenced by their many neighbours before the eventual rise of the Kievan Rus.\n\nCharacterized by Byzantine and North $germanic_noun$ influenced culture and their $heritage_east_slavic_name$ heritage, the East $slavic_collective_noun$ form the link between the West $slavic_collective_noun$ and South $slavic_collective_noun$#!"

 game_concept_wendish: "Wendish"
 game_concept_wends: "Wends"
 game_concept_lechitic: "Lechitic"
 game_concept_lechites: "Lechites"
 game_concept_westslavic: "West $slavic$"
 game_concept_west_slavs: "West $slavic_collective_noun$"
 game_concept_west_slavs_main: ""
 game_concept_west_slavs_main_desc: "#F The West $slavic_collective_noun$, colloquially also known as the Wends or Lechites, are the descendants of the $slavic_collective_noun$ who migrated west into the formerly $germanic_noun$ lands of the Lugians, Gothones and Warini.\n\nSettling along the Vistula, Oder and Elbe rivers, the various $heritage_west_slavic_name$ tribes would gradually repopulate these lands after the departure of its previous inhabitants while simultaneously assimilating the few groups who stayed behind. By the IXth century, most of these Lechitic tribes have established themselves in the western section of the Northern European Plain and became ever more entangled with the $frankish$ and Bulgarian states that surrounded them which contributed to the rise of native principalities such as Moravia or Poland.\n\nCharacterized by their $frankish$ influenced culture and their $heritage_west_slavic_name$ heritage, the West $slavic_collective_noun$ form the northern link between the East $slavic_collective_noun$ and Pannonian $slavic_collective_noun$.#!"

 game_concept_sclavenian: "Sclavenian"
 game_concept_sclavenians: "Sclavenians"
 game_concept_southslavic: "South $slavic$"
 game_concept_south_slavs: "South $slavic_collective_noun$"
 game_concept_south_slavs_main: ""
 game_concept_south_slavs_main_desc: "#F The South $slavic_collective_noun$, colloquially also known as the Sclavenians or Illyrians, are the descendants of the $slavic_collective_noun$ who fled the advance of the Avars by crossing into Byzantine territory over the course of the VIth and VIIth centuries.\n\nRapidly settling the territories stretching from the Black Sea to the Dinaric Alps, the South $slavic_collective_noun$ became the dominant ethno-linguistic group in the Balkans by the IXth century, having assimilated most of the local Greek, Romance and old Illyrian peoples who resided there.\n\nCharacterized by their Byzantine and $frankish$ influenced culture and their $heritage_south_slavic_name$ heritage, the South $slavic_collective_noun$ form the southern link between the East $slavic_collective_noun$ and Pannonian $slavic_collective_noun$.#!"

 game_concept_pannonianslavic: "Pannonian $slavic$"
 game_concept_pannonian_slavs: "Pannonian $slavic_collective_noun$"
 game_concept_pannonian_slavs_main: ""
 game_concept_pannonian_slavs_main_desc: "#F The Pannonian $slavic_collective_noun$ are the descendants of the $slavic_collective_noun$ who lived under Avar rule from the VIth to IXth centuries.\n\nFollowing the disintegration of the Avar Khaganate in the late VIIIth century, the Pannonian $slavic_collective_noun$ utilized the power-vacuum left behind to establish a series of their own principalities such as Savia, Balaton and Carantania, all of which would all gradually fall into the $frankish$ orbit during the IXth century to varying degrees.\n\nCharacterized by their $frankish$ influenced culture and mixed $heritage_south_slavic_name$ and $heritage_east_slavic_name$ heritage, the Pannonian $slavic_collective_noun$ form the link between the South $slavic_collective_noun$ and West $slavic_collective_noun$.#!"

 game_concept_coptic: "Kemetic"
 game_concept_copts: "Kemets"
 game_concept_egyptian: "Egyptian"
 game_concept_egyptians: "Egyptians"
 game_concept_egyptians_main: ""
 game_concept_egyptians_main_desc: "#F The Egyptians were the ancient inhabitants of the Nile Valley stretching from Aswad all the way to the Nile Delta. Though they have never disappeared, the Egyptians have undergone multiple stages of development since the first dynasties arose in the IVth millennium$GAME_DATE_STRING_ERA_BCE$.\n\nThe conquest of Egypt by Alexander the Great has opened the way for the gradual hellenization of the native Egyptians who adopted the Greek alphabet for their own language while also converting to Christianity starting in the Ist century$GAME_DATE_STRING_ERA_CE$ while under $roman$ rule, gradually evolving into the early Copts. In most recent history, Egypt fell under the control of the Islamic Caliphates, marking the beginning of the gradual Arabization and Islamization of the local Coptic populace. \n\nCharacterized by their egyptian heritage and Coptic language, the descendants of the ancient Egyptians continue to inhabit the lands along the Nile despite the gradual linguistic and religious shift that has been occurring since the VIIth century#!"

 game_concept_sogdian: "Kangju"
 game_concept_sogdians: "Kangjus"
 game_concept_sogdians_main: ""
 game_concept_sogdians_main_desc: "#F The Kangjus were an $iranian_noun$ people who inhabited around the Desert of Kyzylkum, spanning modern-day Uzbekistan, Tajikistan, and parts of Kazakhstan. Renowned as merchants along the Silk Road, they facilitated trade between China, Persia, and the Mediterranean. The Kangjus played a major role in spreading cultural and religious influences, including Zoroastrianism, Buddhism, and Nestorian Christianity. Though politically fragmented, their cultural and economic influence endured well into the medieval period. Characterized by their $iranian_noun$ heritage and mercantile traditions, the Kangjus were a vital link in the commercial and cultural exchange of Eurasia.#!"

 game_concept_karluk: "$karluk$"
 game_concept_karluks: "$karluk_collective_noun$"
 game_concept_karluks_main: ""
 game_concept_karluks_main_desc: "#F The $karluk_collective_noun$ were a $turk$ic nomadic people who played a significant role in the medieval history of Central Asia. Originally part of the $gokturk$ Khaganate, they later established their own confederation and were instrumental in the formation of the Karakhanid Khanate. The $karluk_collective_noun$ were among the first $turk$ic groups to convert to Islam, blending their nomadic traditions with Persian and Islamic influences. Characterized by their $turk$ic heritage and warrior ethos, the $karluk_collective_noun$ were key players in the shifting power dynamics of Central Asia.#!"

 game_concept_greek: "Greek"
 game_concept_greeks: "Greeks"
 game_concept_hellenization: "Hellenization"
 game_concept_hellenized: "Hellenized"
 game_concept_hellenic: "Hellenic"
 game_concept_hellen: "Hellen"
 game_concept_hellenes: "Hellenes"
 game_concept_hellenes_main: ""
 game_concept_hellenes_main_desc: "#F The Hellenes, or Greeks, were the people of ancient Greece, whose civilization laid the foundation for Western philosophy, art, and political thought. Their city-states, most notably Athens and Sparta, pioneered early democratic and military institutions. The Hellenes' influence expanded with the conquests of Alexander the Great, spreading Hellenistic culture across the Mediterranean and Near East. Characterized by their Greek heritage and intellectual legacy, the Hellenes shaped the course of classical civilization.#!"

 game_concept_alashiyan: "Alashiyan"
 game_concept_alashiyans: "Alashiyans"
 game_concept_alashiyans_main: ""
 game_concept_alashiyans_main_desc: "#F The Alashiyans were the inhabitants of Alashiya, a prominent Bronze Age polity widely identified with the island of Cyprus, especially its eastern part. Known from Egyptian and Near Eastern records—most notably the Amarna letters—Alashiya was a major hub of copper production and maritime trade during the IIInd and IInd millennia$GAME_DATE_STRING_ERA_BCE$.\n\nAlashiya maintained diplomatic and economic ties with Egypt and the Levant, and its culture reflected both local Cypriot traditions and foreign influences from Anatolia and the Near East. During the widespread collapse of Bronze Age societies around the XIIth century$GAME_DATE_STRING_ERA_BCE$, Alashiya was also affected, with signs of destruction in several sites.\n\nSome scholars associate the Sea Peoples with this period of upheaval, and it is possible that segments of the Alashiyan population were either displaced by or absorbed into these migrating groups. Though their ultimate fate remains unclear, the Alashiyans played a key role in the Bronze Age Mediterranean world, standing at the crossroads of trade, diplomacy, and cultural exchange.#!"

 game_concept_hittite: "Hittite"
 game_concept_hittites: "Hittites"
 game_concept_hittites_main: ""
 game_concept_hittites_main_desc: "#F The Hittites were an Anatolian civilization that rose to prominence in the IInd millennium$GAME_DATE_STRING_ERA_BCE$, establishing one of the great empires of the Bronze Age. Centered in Hattusa, their empire stretched across Anatolia and into the Levant, engaging in both war and diplomacy with Egypt and Mesopotamia. The Hittites are credited with early ironworking and a legal code comparable to that of Hammurabi. Characterized by their Anatolian heritage and complex statecraft, the Hittites left an enduring mark on the ancient Near East.#!"

 game_concept_neo_hittite: "Neo-Hittite"
 game_concept_neo_hittites: "Neo-Hittites"
 game_concept_neo_hittites_main: ""
 game_concept_neo_hittites_main_desc: "#F The Neo-Hittites were the successors of the collapsed Hittite Empire, forming independent city-states in Anatolia and northern Syria during the Iron Age. These states preserved many Hittite traditions while incorporating influences from Assyria and Aram. Although politically fragmented, they maintained their distinct culture until they were gradually absorbed by expanding empires. Characterized by their Anatolian heritage and resilience, the Neo-Hittites played a key role in the cultural continuity of the region.#!"

 game_concept_tarhuntassan: "Tarhuntassan"
 game_concept_tarhuntassans: "Tarhuntassans"
 game_concept_tarhuntassans_main: ""
 game_concept_tarhuntassans_main_desc: "#F The Tarhuntassans were an Anatolian people who emerged as a significant force in the Late Bronze Age, centered around the city of Tarhuntassa. Originally a Hittite vassal state, Tarhuntassa gained prominence during the reign of Muwatalli II, who temporarily relocated the Hittite capital there. The city's name derives from Tarhunt, the storm god of the Hittite pantheon, reflecting its deep religious and cultural ties to broader Hittite traditions.\n\nDespite its prominence, the history of Tarhuntassa remains obscure, as it eventually faded from historical records following the collapse of the Hittite Empire in the early Iron Age. Some scholars believe its inhabitants either assimilated into surrounding Luwian and Phrygian cultures or were displaced by later migrations.\n\nCharacterized by their Anatolian heritage and Hittite-influenced administrative structures, the Tarhuntassans represent one of the many lost civilizations that once thrived in Bronze Age Anatolia.#!"

 game_concept_emari: "Emari"
 game_concept_emaris: "Emaris"
 game_concept_emaris_main: ""
 game_concept_emaris_main_desc: "#F The Emaris were the inhabitants of Emar, a thriving city-state located on the middle Euphrates, which played a crucial role in the political and economic networks of Late Bronze Age Syria. Positioned at the crossroads of major Mesopotamian, Hittite, and Levantine trade routes, Emar flourished as a center of commerce, administration, and religious activity.\n\nEmar's culture reflected a blend of Hurrian, Semitic, and Anatolian influences, with its people worshipping deities from various pantheons, including the Mesopotamian god Dagan and the Hurrian storm god Teshub. The city's legal and administrative records, preserved in Akkadian cuneiform tablets, provide valuable insights into its governance, social structure, and religious practices.\n\nBy the late 13th century$GAME_DATE_STRING_ERA_BCE$, Emar fell to the expanding Assyrian Empire, marking the decline of its independence. Despite its destruction, the city's legacy endured through its extensive archives, which remain one of the richest sources of information on the Late Bronze Age Near East.\n\nCharacterized by their Semitic and Hurrian heritage, as well as their role as cultural intermediaries, the Emaris represent a civilization deeply woven into the fabric of ancient Near Eastern history.#!"

 game_concept_native_anatolian: "Native Anatolian"
 game_concept_native_anatolians: "Native Anatolians"
 game_concept_native_anatolians_main: ""
 game_concept_native_anatolians_main_desc: "#F The Native Anatolians were the indigenous peoples of Anatolia before the arrival of Indo-European groups. Their civilizations, such as the Hattians and Luwians, contributed to the cultural mosaic of the region with unique languages, religious practices, and architectural achievements. Despite being assimilated into later empires, their influence persisted in Anatolian traditions. Characterized by their deep-rooted heritage, the Native Anatolians were foundational to the ancient history of the region.#!"

 game_concept_donghu: "Donghu"
 game_concept_mongolic: "Mongolic"
 game_concept_mongol: "Mongol"
 game_concept_mongols: "Mongols"
 game_concept_mongolian: "Mongolian"
 game_concept_mongolians: "Mongolians"
 game_concept_mongolized: "Mongolized"
 game_concept_early_mongol: "Early Mongol"
 game_concept_early_mongols: "Early Mongols"
 game_concept_early_mongolian: "Early Mongolian"
 game_concept_early_mongolians: "Early Mongolians"
 game_concept_early_mongols_main: ""
 game_concept_early_mongols_main_desc: "#F The Early Mongols were the ancestors of later Mongolic-speaking peoples, emerging from the northeastern steppes of Asia long before the rise of Genghis Khan. Rooted in nomadic traditions, their societies were organized around pastoralism, expert horsemanship, and a clan-based structure that defined steppe life for centuries.\n\nOne of the earliest known Mongolic groups was the Donghu, a powerful confederation that dominated eastern Mongolia and Manchuria during the Ist millennium$GAME_DATE_STRING_ERA_BCE$. Their political model influenced later steppe empires, though their dominance ended with their defeat by the Xiongnu in the IIIrd century$GAME_DATE_STRING_ERA_BCE$. Their descendants, including the Xianbei and Wuhuan, continued to shape the history of Inner Asia and northern China.\n\nAnother important cultural marker is the Slab-Grave Culture, linked to the ancestors of the Mongols. Flourishing from the late IInd to the Ist millennium$GAME_DATE_STRING_ERA_BCE$, these societies practiced distinctive burial traditions and shared the mobile, livestock-based economy of the steppe nomads.\n\nOver time, the Early Mongols evolved into new confederations, such as the Khitan and Shiwei, eventually leading to the formation of the Mongol Empire in the XIIIth century. Though often overshadowed by later history, the Early Mongols laid the foundations of Inner Asian political and cultural identity.#!"

 game_concept_tibetanized: "Tibetanized"
 game_concept_tibetan: "Tibetan"
 game_concept_tibetans: "Tibetans"
 game_concept_tibetans_main: ""
 game_concept_tibetans_main_desc: "#F The Tibetans are a people indigenous to the vast highlands of the Tibetan Plateau, where their ancestors have lived since prehistoric times. By the IInd millennium$GAME_DATE_STRING_ERA_BCE$, early Tibetan cultures had developed distinct traditions of pastoralism, fortified hill settlements, and ritual practices influenced by the harsh environment of the plateau.\n\nIn the Ist millennium$GAME_DATE_STRING_ERA_BCE$, Tibetan-speaking tribes coalesced into various regional polities, laying the groundwork for what would later become the Tibetan Empire. By the VIIth century$GAME_DATE_STRING_ERA_CE$, this empire emerged as a dominant force in Central Asia, engaging in both conflict and cultural exchange with the Tang Dynasty and the Indian subcontinent. The introduction of Buddhism during this period reshaped Tibetan society, eventually leading to the development of the powerful monastic traditions that continue to define Tibetan culture.\n\nCharacterized by their adaptation to extreme altitudes, strong warrior traditions, and deep spiritual heritage, the Tibetans have maintained a distinct identity despite centuries of political and cultural transformations.#!"

 game_concept_ugric: "Ugric"
 game_concept_ugrian: "Ugrian"
 game_concept_ugrians: "Ugrians"
 game_concept_ugrians_main: ""
 game_concept_ugrians_main_desc: "#F The Ugrians are a people of Uralic origin who historically inhabited the vast forested regions of Siberia and the Ural Mountains. Linguistically and culturally, they are closely related to the broader Uralic peoples, particularly the Finns, Estonians, and Samoyeds.\n\nDuring antiquity, the Ugrians were primarily hunter-gatherers and semi-nomadic pastoralists, relying on reindeer herding and riverine trade networks. By the early medieval period, some Ugrian groups, Magyars, particularly the ancestors of the Hungarians, began moving westward under pressure from expanding steppe empires. This migration eventually led to the formation of the Magyar state in the Carpathian Basin, while other Ugrian groups, such as the Khanty and Selkup, remained in Siberia.\n\nDespite their divergence, the Ugrians retained linguistic and cultural similarities, with many of their traditions surviving among the modern Uralic-speaking peoples. Characterized by their adaptability, endurance in harsh climates, and deep-rooted oral traditions, the Ugrians played an important role in the ethno-linguistic development of Eurasia.#!"

 game_concept_oghuric: "Oghuric"
 game_concept_oghur: "Oghur"
 game_concept_oghurs: "Oghurs"
 game_concept_oghurs_main: ""
 game_concept_oghurs_main_desc: "#F The Oghurs were a people of $turk$ic origin who played a crucial role in the migration and political transformations of Inner Asia. Their early history is closely linked to the Xiongnu, with some scholars suggesting that they may have been among the tribes under Xiongnu rule before its collapse.\n\nFollowing the dissolution of the Xiongnu Confederation, the Oghurs became part of the emerging nomadic power structures in Mongolia and Gansu. They maintained strong ties with the Tuoba (Tabgatch), a Eastern Oghuric and Xianbei hybrid-derived dynasty that ruled Northern China, before eventually migrating westward from Gansu due to internal conflicts and pressure from other nomadic groups.\n\nBy the Vth century, the Oghurs had moved into the Caspian-Pontic steppe, where they formed the foundation of various later $turk$ic polities, including the Bulgar and Khazar states. Here they influenced the Ounnons and the Magyars. Their language and traditions significantly influenced early $turk$ic history, distinguishing them from the later Shaz-$turk$ic groups.\n\nCharacterized by their steppe warrior ethos, linguistic innovations, and role as cultural intermediaries, the Oghurs were one of the defining early $turk$ic groups to shape the history of Inner Asia and Eastern Europe.#!"

 game_concept_yeniseian: "Yeniseian"
 game_concept_yeniseians: "Yeniseians"
 game_concept_yeniseians_main: ""
 game_concept_yeniseians_main_desc: "#F The Yeniseians are an ancient Siberian people who once inhabited large parts of western and central Siberia, likely dominating the region before being gradually displaced by incoming Turkic, Ugric, and Tungusic groups. Today, only the Ket people remain, speaking a highly endangered language along the middle Yenisei River.\n\nTheir language family, Yeniseian, is unique in Eurasia and unrelated to surrounding tongues. Some scholars propose a distant linguistic link between Yeniseian and certain Native American languages, suggesting a deep prehistoric connection, though this remains debated.\n\nOccasionally associated with the ruling class of ancient steppe powers like the Xiongnu, the Yeniseians may have once played a far greater role in Inner Asian history than their modern obscurity suggests.#!"

 game_concept_proto_turkic_demonym: "Qonggai"
 game_concept_proto_turkic: "Proto-Turkic"
 game_concept_proto_turks: "Proto-Turks"
 game_concept_early_turkic: "Early Turkic"
 game_concept_early_turks: "Early Turks"
 game_concept_early_turks_main: ""
 game_concept_early_turks_main_desc: "#F The $game_concept_early_turks$ or $game_concept_proto_turks$ were the early ancestors of the $turk$ic peoples, gradually emerging on the north-west steppes of Asia, likely between of Altai-Sayan region and Yellow River, during the late Bronze and early Iron Ages. Rather than appearing suddenly, they formed over centuries through the fusion of local Siberian forager-pastoralist populations and steppe nomadic traditions.\n\nDuring their formative period, the Early $turk$s lived in close proximity to powerful steppe cultures such as the Scythians. These interactions—whether through warfare, trade, or cultural borrowing—profoundly shaped early $turk$ic identity. The shared nomadic lifestyle, use of mounted archery, social structures centered around warrior elites, and even aspects of steppe religion and art show clear parallels. It is likely that contact with Scytho-Saka groups introduced key technologies and steppe symbols that would persist in $turk$ic culture for centuries.\n\nBy the Ist millennium$GAME_DATE_STRING_ERA_BCE$, the Early $turk$s began appearing in Chinese records under various names, often grouped among the northern 'barbarian' tribes such as the Dingling, Gaoju, and later the Tiele. Though ethnically diverse, these groups formed the cultural substrate from which historical $turk$s would arise.\n\nThe Early $turk$s were not a single people, but a broad cultural and linguistic horizon shaped by centuries of steppe interaction. Out of this milieu, the first recognizably $turk$ic states would later emerge—rooted in Iranian-influenced nomadism, but distinctly their own.#!"

 game_concept_asia_huns: "Asia Huns"
 game_concept_xiongnu: "Xiongnu"
 game_concept_xiongnu_main: ""
 game_concept_xiongnu_main_desc: "#F The Xiongnu or 'Asia Huns' were a powerful nomadic confederation that emerged on the eastern Eurasian steppe during the late IIIrd century$GAME_DATE_STRING_ERA_BCE$, becoming the first historically documented steppe empire to challenge the Han Dynasty of China. Also related with the early Oghuric people. Originating north of the Great Wall, in what is now Mongolia and southern Siberia, the Xiongnu united various tribes under a centralized leadership known as the Chanyu, establishing a political structure that would serve as a model for later steppe empires.\n\nHighly skilled in mounted warfare and archery, the Xiongnu relied on a mobile pastoralist economy, with horses, sheep, and cattle forming the backbone of their society. Their raids and military campaigns against the Han forced the Chinese to strengthen and expand the Great Wall, as well as develop sophisticated diplomatic and military strategies to contain Xiongnu influence. At times, relations between the two powers oscillated between brutal warfare and uneasy peace, marked by marriage alliances and tribute systems.\n\nBy the Ist century$GAME_DATE_STRING_ERA_CE$, internal divisions and sustained pressure from the Han Empire led to the fragmentation of the Xiongnu confederation. One branch, the Southern Xiongnu, submitted to Han authority, while the Northern Xiongnu continued to resist but eventually faded from historical prominence. Some scholars suggest that remnants of the Xiongnu migrated westward, possibly contributing to the formation of later nomadic groups such as the Huns.\n\nCharacterized by their sophisticated confederational structure, nomadic warfare, and enduring influence on steppe geopolitics, the Xiongnu marked the beginning of a long tradition of steppe empires that would shape the history of both Asia and Europe.#!"

 game_concept_tujue: "Tujue"
 game_concept_tujues: "Tujues"
 game_concept_tujues_main: ""
 game_concept_tujues_main_desc: "#F The Tujues were a $turk$ic nomadic confederation known in Chinese sources as the $gokturk$s. They established the first known $turk$ic empire in the VIth century, controlling vast territories across the Eurasian steppe. Their society was highly militarized, and they played a key role in the politics of China, Persia, and Byzantium. Characterized by their $turk$ic heritage and steppe warrior culture, the Tujues laid the groundwork for future $turk$ic empires.#!"

 game_concept_on_oq: "On-Oq"
 game_concept_on_oqs: "On-Oqs"
 game_concept_on_oqs_main: ""
 game_concept_on_oqs_main_desc: "#F The On-Oqs, or 'Ten Arrows', were a confederation of $turk$ic tribes that emerged after the fragmentation of the $gokturk$ Khaganate. They occupied regions of Central Asia and were closely involved with the early Islamic Caliphates and Chinese dynasties. Characterized by their nomadic traditions and military prowess, the On-Oqs played a significant role in the power struggles of the steppe.#!"

 game_concept_toquz_oghuz: "Toquz-Oghuz"
 game_concept_toquz_oghuz_main: ""
 game_concept_toquz_oghuz_main_desc: "#F The Toquz-Oghuz were a powerful $turk$ic tribal confederation that played a prominent role in Central Asia during the early medieval period. They later contributed to the formation of the Uyghur Khaganate. Their society was structured around clan alliances, and they had significant interactions with China and Persia. Characterized by their $turk$ic heritage and nomadic resilience, the Toquz-Oghuz were a dominant force in steppe history.#!"

 game_concept_kurdish: "Kurdish"
 game_concept_kurd: "Kurd"
 game_concept_kurds: "Kurds"
 game_concept_kurds_main: ""
 game_concept_kurds_main_desc: "#F The Kurds are a people native to the mountainous regions of the Zagros and Taurus ranges, with historical roots tracing back to the early IInd millennium$GAME_DATE_STRING_ERA_BCE$. Though their precise ethnogenesis remains debated, the Kurds are believed to descend from a mix of ancient $iranian_noun$, Hurrian, and possibly Gutian tribes that inhabited these lands.\n\nBy the Ist millennium$GAME_DATE_STRING_ERA_BCE$, the Medes, often considered among their ancestors, rose to prominence, playing a crucial role in the downfall of the Neo-Assyrian Empire. Over the centuries, the Kurds maintained a strong warrior tradition, resisting foreign domination while adapting to various empires, including the Achaemenids, Parthians, and Sassanids.\n\nDuring the medieval period, Kurdish principalities emerged, exerting regional influence despite the pressures of larger imperial entities. Characterized by their $iranian_noun$ linguistic heritage and resilient mountain culture, the Kurds have remained a distinct and enduring people throughout history.#!"

 game_concept_zagrosi: "Zagrosi"
 game_concept_zagrosian: "Zagrosian"
 game_concept_zagrosians: "Zagrosians"
 game_concept_zagrosians_main: ""
 game_concept_zagrosians_main_desc: "#F The Zagrosians were a collection of ancient mountain-dwelling peoples who inhabited the rugged Zagros Mountains, spanning parts of modern-day $iran_noun$ and Iraq. Among the most prominent of these groups were the Gutians, Kassites, and Lullubians, each of whom played a significant role in the political and military history of Mesopotamia.\n\nThe Gutians, often described as fierce raiders, contributed to the downfall of the Akkadian Empire around the XXIInd century$GAME_DATE_STRING_ERA_BCE$ before briefly ruling over Sumer. The Kassites, in contrast, established a more enduring presence, ruling Babylonia for centuries and integrating into Mesopotamian culture. The Lullubians, known for their conflicts with the Akkadians and Assyrians, were a resilient mountain people who maintained their autonomy through guerrilla warfare and strategic alliances.\n\nDespite their varied fates, the Zagrosian peoples shared common traits of tribal organization, warrior traditions, and interaction with Mesopotamian civilizations. Over time, they were assimilated into larger $iranian_noun$ and Mesopotamian cultures, but their legacy endured in the region's dynastic and military traditions.\n\nCharacterized by their mountainous heritage, warrior ethos, and complex relations with Mesopotamian states, the Zagrosians played a crucial role in the shifting power dynamics of the ancient Near East.#!"

 game_concept_armenian: "Armenian"
 game_concept_armenians: "Armenians"
 game_concept_armenians_main: ""
 game_concept_armenians_main_desc: "#F The Armenians are an ancient people who have inhabited the Armenian Highlands since at least the Ist millennium$GAME_DATE_STRING_ERA_BCE$. Emerging as a distinct culture under the influence of Hurrian, Urartian, and later Indo-European elements, the Armenians gradually consolidated into a unified identity. By the early IInd millennium$GAME_DATE_STRING_ERA_BCE$, they had already begun forming political entities, culminating in the powerful Kingdom of Urartu, which was eventually succeeded by the Kingdom of Armenia.\n\nThroughout antiquity and the medieval period, Armenia stood at the crossroads of great empires, including the Achaemenids, Romans, Byzantines, and various Islamic dynasties. Despite repeated conquests, the Armenians managed to preserve their distinct language, traditions, and Christian faith, which they adopted in the early IVth century.\n\nCharacterized by their Indo-European language and highland traditions, the Armenians remain one of the oldest continuously existing peoples of the Near East.#!"

 game_concept_proto_armenian: "Hayasa"
 game_concept_proto_armenians: "Hayasas"
 game_concept_proto_armenians_main: ""
 game_concept_proto_armenians_main_desc: "#F The Early Hayasa tribes also known as the Proto-Armenians, was trace their roots to the ancient lands of the Pontic Steppes, a region rich in cultural and historical significance. Hayasa people are believed to have formed from the early Thracians, where a Indo-European tribe. During the period between the XXth and VIIth centuries $GAME_DATE_STRING_ERA_BCE$, interactions between these steppe migrants and local populations, such as the Hurrians and Urartians, played a crucial role in shaping Armenian heritage.\n\nHayasa tribes of this era were often part of larger political structures but maintained their distinct language identity. Their presence in historical records suggests an engagement in trade, craftsmanship, and religious practices that set them apart from other regional populations. With the dominance of powerful empires, such as the Urartian kingdom, the Hayasa tribes created their unique customs, while also integrating linguistic attributes and elements from their steppe ancestors.\n\nAs time progressed, the integration of Hayasa tribes into different ruling entities led to further evolution in their languages and societal frameworks. However, the enduring nature of their heritage ensured that essential elements of their identity remained intact. This period laid the foundation for the later development of the Armenian nation, contributing to the deep-rooted connections between past and present Armenian peoples.#!"

 #game_concept_orontid: "Orontid"
 #game_concept_orontids: "Orontids"
 #game_concept_orontids_main: "Orontid"
 #game_concept_orontids_main_desc: "#F The Orontids were an Armenian ruling house of probable $iranian_noun$ origin that governed Armenia from the VIth century$GAME_DATE_STRING_ERA_BCE$ until the IInd century$GAME_DATE_STRING_ERA_BCE$. Initially serving as satraps under the Achaemenid Persian Empire, the Orontids played a key role in maintaining Persian influence in the region while fostering a distinct Armenian culture.\n\nFollowing the fall of the Achaemenids, the Orontids navigated the turbulent Hellenistic period, often shifting allegiances between the Seleucids and local Armenian nobility. By the IIIrd century$GAME_DATE_STRING_ERA_BCE$, they had established a more autonomous rule, particularly in the kingdoms of Sophene and Commagene. However, their dynasty eventually gave way to the Artaxiad dynasty, which would further shape Armenia's future.\n\nBlending $iranian_noun$ governance with local Armenian traditions, the Orontids laid the foundation for the Armenian monarchy. Characterized by their $iranian_noun$ and Armenian heritage, they stand as a crucial link between the ancient Persian empires and the independent Armenian kingdoms that followed." #\n\n\n#T Related $game_concept_ancestral_communities$#!\n[native_anatolians|L], [proto_armenians|L], [armenians|L], [iranians|L], [urartuans|L], [hurrians|L]

 game_concept_hurrianized: "Hurrianized"
 game_concept_hurrian: "Hurrian"
 game_concept_hurrians: "Hurrians"
 game_concept_hurrians_main: ""
 game_concept_hurrians_main_desc: "#F The Hurrians were an ancient people who inhabited the Near East, primarily in the regions of the Upper Tigris and Euphrates, during the IIIrd and IInd millennia$GAME_DATE_STRING_ERA_BCE$. Likely originating from the Armenian Highlands, they played a significant role in the political landscape of Mesopotamia and Anatolia.\n\nBy the IInd millennium$GAME_DATE_STRING_ERA_BCE$, the Hurrians had established several influential states, including the Kingdom of Mitanni, which became a major rival to the Hittites and Egyptians. Despite their decline in the late IInd millennium$GAME_DATE_STRING_ERA_BCE$, the Hurrians left a lasting linguistic and cultural impact, particularly on the later Urartians and some elements of Assyrian and Hittite civilization.\n\nCharacterized by their unique non-Semitic, non-Indo-European language and their advanced state-building, the Hurrians were a crucial force in shaping the early history of the Near East.#!"

 game_concept_urartuan: "Urartuan"
 game_concept_urartuans: "Urartuans"
 game_concept_urartuans_main: ""
 game_concept_urartuans_main_desc: "#F The Urartians were an ancient people who ruled over the Kingdom of Urartu, centered in the Armenian Highlands between the IXth and VIth centuries$GAME_DATE_STRING_ERA_BCE$. Directly influenced by the earlier Hurrian civilizations, the Urartians were known for their sophisticated irrigation systems, fortress cities, and militaristic expansion.\n\nAt its peak, the Urartian Kingdom rivaled the Assyrians, controlling a vast territory stretching from eastern Anatolia to the Caucasus. However, by the VIth century$GAME_DATE_STRING_ERA_BCE$, Urartu fell to a combination of Median, Scythian, and internal pressures, with its people gradually assimilating into Armenian and other regional cultures.\n\nCharacterized by their advanced engineering, fortress cities, and a language linked to Hurrian, the Urartians played a foundational role in the early history of the Armenian Highlands.#!"

 game_concept_celtic: "Celtic"
 game_concept_celt: "Celt"
 game_concept_celts: "Celts"
 game_concept_celts_main: ""
 game_concept_celts_main_desc: "#F The Celts were a diverse group of Indo-European peoples who first emerged in Central Europe during the late IInd millennium$GAME_DATE_STRING_ERA_BCE$, expanding across much of Western Europe by the Ist millennium$GAME_DATE_STRING_ERA_BCE$. Known for their warrior culture, intricate art, and oral traditions, the Celts formed numerous tribal confederations rather than a singular empire.\n\nBy the IInd century$GAME_DATE_STRING_ERA_BCE$, Celtic societies had spread from the British Isles to Anatolia, where the Galatians established a presence. Despite $roman$ conquest and assimilation, Celtic languages and traditions persisted in regions like Ireland, Scotland, Wales, and Brittany.\n\nCharacterized by their complex social structures, druidic religious traditions, and distinct linguistic heritage, the Celts significantly shaped the cultural landscape of ancient Europe.#!"

 #game_concept_gaulish: "Gaulish"
 #game_concept_gaul: "Gaul"
 #game_concept_gauls: "Gauls"
 #game_concept_gauls_main: "Gauls"
 #game_concept_gauls_main_desc: "#F The Gauls were a branch of the Celtic peoples who inhabited what is now France, Belgium, and parts of Italy and Germany during the Ist millennium$GAME_DATE_STRING_ERA_BCE$. They were organized into numerous independent tribes, often engaging in both trade and conflict with their neighbors, including the Romans and $germanic_noun$ peoples.\n\nBy the IInd century$GAME_DATE_STRING_ERA_BCE$, the Gauls had established powerful confederations, but their resistance to $roman$ expansion ultimately failed with Julius Caesar's conquest of Gaul in the Ist century$GAME_DATE_STRING_ERA_BCE$. Over time, the Gauls adopted Latin and $roman$ customs, though some elements of their original culture persisted into the medieval period.\n\nCharacterized by their warrior ethos, vibrant artistic traditions, and complex tribal societies, the Gauls played a key role in shaping early European history.\n\n\n#T Related $game_concept_ancestral_communities$#!\n[celts|L], [gallics|L], [romans|L], [germans|L]"

 game_concept_gallian: "Gallian"
 game_concept_gallians: "Gallian"
 game_concept_gallic: "Gallic"
 game_concept_gallics: "Gallics"
 game_concept_gallics_main: ""
 #game_concept_gallics_main_desc: "#F The term 'Gallics' broadly refers to the cultural and linguistic legacy of the Gauls, particularly in the post-$roman$ period. As $roman$ influence spread, the Gallic identity gradually fused with Latin traditions, forming the basis for the later $roman_prefix$-Gallic culture.\n\nBy the early medieval period, the Gallic identity had largely merged into emerging Romance-speaking groups, such as the $frankish_collective_noun$ in northern Gaul. Nevertheless, elements of Gallic heritage persisted in regional traditions, place names, and linguistic substrata.\n\nCharacterized by their transition from Celtic to Romanized identities, the Gallics were instrumental in the cultural transformation of Western Europe.\n\n\n#T Related $game_concept_ancestral_communities$#!\n[celts|L], [gauls|L], [romans|L], [germans|L]"
 game_concept_gallics_main_desc: "#F The Gallic were a branch of the Celtic peoples who inhabited what is now France, Belgium, and parts of Italy and Germany during the Ist millennium$GAME_DATE_STRING_ERA_BCE$. Organized into numerous independent tribes, they engaged in both trade and conflict with neighboring civilizations, including the Romans and Germanic peoples. By the IInd century$GAME_DATE_STRING_ERA_BCE$, the Gallic had established powerful confederations, but their resistance to Roman expansion ultimately failed with Julius Caesar's conquest of Gaul in the Ist century$GAME_DATE_STRING_ERA_BCE$.\n\nAs Roman influence spread, the Gallic gradually adopted Latin language and Roman customs, leading to a fusion of Gallic and Roman traditions. This cultural synthesis laid the foundation for what would later be recognized as a Roman-Gallic identity. By the early medieval period, Gallic identity had largely merged into emerging Romance-speaking groups, such as the Frankish peoples in northern Gaul. Nevertheless, elements of Gallic heritage persisted in regional traditions, place names, and linguistic substrata.\n\nCharacterized by their transition from Celtic to Romanized identities, the Gallics played a key role in shaping the cultural transformation of Western Europe. Their warrior ethos, vibrant artistic traditions, and complex tribal societies left a lasting imprint on European history.#!"

 game_concept_gaelic: "Gaelic"
 game_concept_goidelic: "Goidelic"
 game_concept_goidelics: "Goidelics"
 game_concept_goidelics_main: ""
 game_concept_goidelics_main_desc: "#F The Goidelics, or Gaelic Celts, were a branch of the Celtic peoples who migrated to Ireland and western Scotland in the Ist millennium$GAME_DATE_STRING_ERA_BCE$. Distinct from the $brythonic$ Celts, the Goidels developed unique linguistic and cultural traditions, including the early forms of Gaelic languages.\n\nBy the early medieval period, Goidelic culture flourished in Ireland and Scotland, giving rise to legendary kingdoms such as Dal Riata and the High Kingship of Tara. Their oral traditions, poetic heritage, and clan-based society remained central to their identity well into the modern period.\n\nCharacterized by their insular Celtic languages and warrior traditions, the Goidelics played a crucial role in the formation of $irish$ and Scottish national identities.#!"

 game_concept_old_galician: "Callaecian"
 game_concept_old_asturian: "Asturian"
 game_concept_old_cantabrian: "Cantabrian"
 game_concept_celtiberian: "Celtiberian"
 game_concept_celtiberians: "Celtiberians"
 game_concept_celtiberians_main: ""
 game_concept_celtiberians_main_desc: "#F The Celtic Iberians were the ancient inhabitants of the northern and western regions of the Iberian Peninsula. While most of them were conquered and assimilated in time, the old Callaeci, Astures and Cantabri managed to resist the Romans until the Augustan era, only being subjugated around the late Ist century$GAME_DATE_STRING_ERA_BCE$. Despite this however, they managed to preserve their language and culture way into the early medieval period during which they would briefly reassert their independence.\n\nThough they would finally be conquered and Romanized for good by the Visigoths, they would still play a vital role in the future of Iberia: After the Muslim Conquest of the peninsula, parts of the Visigothic nobility would flee to the mountainous regions where they would ally with the locals to form the Kingdom of Asturias, the predecessor to later kingdoms such as León, Castile and Galicia.#!"

 game_concept_paleo_iberian: "Paleo-Iberian"
 game_concept_paleo_iberians: "Paleo-Iberians"
 game_concept_paleo_iberians_main: ""
 game_concept_paleo_iberians_main_desc: "#F The Paleo-Iberians were the diverse pre-Roman peoples inhabiting the Iberian Peninsula before the expansion of Roman rule. Scattered across the rugged landscapes of the region, they encompassed various cultural and linguistic groups, including the Iberians, Celtiberians, Tartessians, and Vascones. Though differing in language and customs, these groups shared common elements in their social structures, warfare, and trade practices.\n\nBy the IInd millennium$GAME_DATE_STRING_ERA_BCE$, Iberian societies had developed complex settlements fortified with stone walls, engaged in metallurgy, and maintained extensive trade networks with Mediterranean civilizations such as the Phoenicians and Greeks. Their warrior culture was well-documented, with skilled horsemen and iron weaponry playing key roles in their conflicts. In contrast, some groups in the northwest and mountainous regions remained more isolated, preserving distinct traditions that would later influence the medieval Basques and other regional identities.\n\nDespite their resilience, the Paleo-Iberians gradually succumbed to external pressures, first from Carthaginian expansion in the IIIrd century$GAME_DATE_STRING_ERA_BCE$ and later from Roman conquest. By the Ist century$GAME_DATE_STRING_ERA_BCE$, much of the Iberian Peninsula had been incorporated into the Roman world, marking the decline of their distinct cultural and political structures. However, traces of their languages, artistic traditions, and societal practices persisted, leaving a lasting legacy in the region's historical fabric.#!"

 game_concept_elbe_germanic: "Irminonic"
 game_concept_elbe_germanic_main: ""
 game_concept_elbe_germanic_main_desc: "#F Irminonic, also known as Elbe Germanic, was a branch of the Central Germanic languages spoken by various tribes inhabiting central Germania. It is considered the linguistic ancestor of several medieval and modern German dialects, particularly those spoken in Franconia, Thuringia, and Swabia.\n\nThe term 'Irminonic' derives from Irmin, a deity or mythical figure in early Germanic traditions. Unlike the northern Ingaevonic and western Istvaeonic groups, Irminonic-speaking peoples had closer contact with Celtic and Romanized cultures, leading to significant linguistic and cultural exchanges.\n\nOver time, Irminonic dialects evolved into various High German dialects, influencing the formation of the modern German language. Characterized by its central Germanic heritage and role in shaping later linguistic developments, Elbe Germanic was one of the key linguistic branches of early Central Germanic speech."

 game_concept_weser_rhine_germanic: "Istvaeonic"
 game_concept_weser_rhine_germanic_main: ""
 game_concept_weser_rhine_germanic_main_desc: "#F Istvaonic, also known as Weser-Rhine Germanic, was a branch of the West Germanic languages spoken in the western regions of Germania, particularly along the Rhine and the Low Countries. It is considered the primary linguistic ancestor of the Old Frankish language, which later evolved into Old Dutch and influenced Old French.\n\nIstvaonic speakers were among the first Germanic peoples to interact with the Roman Empire, leading to extensive linguistic borrowing and the early development of distinct West Germanic dialects. Some of the most well-known Istvaonic-speaking groups included the Franks, Chatti, and Batavians.\n\nOver time, Istvaonic dialects contributed to the formation of Middle Dutch and other early medieval languages of Western Europe. Characterized by their western Germanic heritage and role in the linguistic transformation of the Roman frontier, Weser-Rhine Germanic remains an essential part of the historical development of Germanic languages."

 game_concept_east_frankish: "East $frankish$"
 game_concept_germanic: "$germanic_noun$"
 game_concept_germans: "Germans"
 game_concept_germans_main: ""
 game_concept_germans_main_desc: "#F The Germans are the descendants of various old $germanic_noun$ tribes that inhabited the eastern territories of Francia such as the Rhineland, Saxony or Franconia.\n\nWhile originally divided between their tribal components such as the $frankish_collective_noun$, $old_saxon_collective_noun$, $alamannic_collective_noun$ and Bavarians, these tribes shared a series of similar $germanic_noun$ dialects that separated them from the gradually romanised $frankish_collective_noun$ to the west. This shared Diutsc language would then go on to form the basis for a shared identity that made these central Europeans different from their Romance and $slavic$ neighbours, although it wouldn't be until the modern period that a true sense of a shared national identity would emerge. Nevertheless, these central European Diutsc speakers would still, in spite of changing and evolving tribal identities that usually served as an umbrella term for this group, become known as a more or less single coherent people and play a crucial role in European dynastic and political history for centuries to come.\n\nCharacterized by their $frankish$ influenced culture and their $heritage_central_germanic_name$ heritage, the Germans exist primarily within Central Europe in the territories that made up East Francia.#!"

 game_concept_central_germanic: "Central $germanic_noun$"
 game_concept_central_germans: "Central Germans"
 game_concept_central_germans_main: ""
 game_concept_central_germans_main_desc: "#F The Central Germans were a grouping of various $germanic_noun$ tribes that occupied the heartland of Germania. Descending from early $heritage_west_germanic_name$ dialect groups, they played a crucial role in the eventual formation of medieval German identity. Though politically fragmented, these tribes shared linguistic and cultural similarities that distinguished them from both their northern and western neighbors. By the early medieval period, many $heritage_central_germanic_name$ groups were absorbed into the emerging $frankish$, $old_saxon$, and Alemannic polities, setting the stage for the later development of the Holy $roman$ Empire.#!"

 game_concept_alemanni: "$alamannic$"
 game_concept_alemannis: "$alamannic_collective_noun$"
 game_concept_alemannis_main: ""
 game_concept_alemannis_main_desc: "#F The $alamannic_collective_noun$ were a confederation of $germanic_noun$ tribes that emerged in the IIIrd century$GAME_DATE_STRING_ERA_CE$ along the upper Rhine. Initially raiders who frequently clashed with the $roman$ frontier, they eventually settled in what is now Swabia, forming a distinct cultural and linguistic identity. Despite their incorporation into the $frankish$ realm in the VIth century, the Alemannic dialects and traditions persisted, influencing the development of later Swabian and Swiss identities.#!"

 game_concept_suebic: "Suebic"
 game_concept_suebi: "Suebi"
 game_concept_suebis: "Suebis"
 game_concept_suebis_main: ""
 game_concept_suebis_main_desc: "#F The Suebis were a collection of $germanic_noun$ tribes that originated from the Elbe region and later migrated into various parts of Europe. Known for their distinctive knot hairstyles and warrior traditions, they played a key role in the $germanic_noun$ migrations of the Ist and IInd centuries$GAME_DATE_STRING_ERA_CE$. A faction of the Suebis famously crossed into Hispania in the early Vth century, where they established a short-lived kingdom before being absorbed by the Visigoths.#!"

 game_concept_langobard: "Langobard"
 game_concept_lombard: "Lombard"
 game_concept_lombards: "Lombards"
 game_concept_lombards_main: ""
 game_concept_lombards_main_desc: "#F The Langobards also known as Lombard were a $germanic_noun$ people originally from the lower Elbe who migrated southward over the course of centuries. By the VIth century$GAME_DATE_STRING_ERA_CE$, they successfully invaded Italy, overthrowing the Ostrogothic kingdom and establishing the Lombard Kingdom. Though eventually defeated by the $frankish_collective_noun$, their influence remained strong, and they played a significant role in shaping the medieval identity of northern Italy.#!"

 game_concept_scandinavian: "Scandinavian"
 game_concept_scandinavians: "Scandinavians"
 game_concept_north_germanic: "North $germanic_noun$"
 game_concept_north_germans: "North Germans"
 game_concept_north_germans_main: ""
 game_concept_north_germans_main_desc: "#F The North Germans were a collection of $germanic_noun$ tribes that inhabited the coastal and inland regions of what is now northern Germany and southern Scandinavia. Distinguished by their close ties to seafaring and trade, these tribes played a significant role in early $germanic_noun$ migration patterns. Over time, many of these groups, including the $old_saxon_collective_noun$ and Angles, expanded into Britain, while others evolved into the later medieval polities of Denmark and northern Germany.#!"

 game_concept_norseman: "Norseman"
 game_concept_norsemans: "Norsemans"
 game_concept_norse: "Norse"
 game_concept_norses: "Norses"
 game_concept_norses_main: ""
 game_concept_norses_main_desc: "#F The Norses were seafaring $germanic_noun$ peoples who inhabited Scandinavia, known for their raids, trade, and exploration throughout the early medieval period. Their influence stretched from the British Isles to the eastern reaches of Russia, with settlements even in distant lands such as Iceland and Greenland. Though commonly associated with the Viking Age, their culture was deeply rooted in earlier North $germanic_noun$ traditions.#!"

 game_concept_geat: "Geat"
 game_concept_geats: "Geats"
 game_concept_geats_main: ""
 game_concept_geats_main_desc: "#F The Geats were a North $germanic_noun$ people who inhabited what is now southern Sweden. Known from legendary sources such as Beowulf, they played a crucial role in early Scandinavian history. Eventually, they were unified with the Swedes, forming the foundation of the medieval Swedish kingdom. Despite this integration, Geatish identity persisted for centuries, influencing the cultural landscape of Sweden.#!"

 game_concept_dane: "Dane"
 game_concept_danes: "Danes"
 game_concept_danes_main: ""
 game_concept_danes_main_desc: "#F The Danes were a powerful North $germanic_noun$ people originating from the region of modern Denmark. By the early medieval period, they were one of the dominant Viking groups, conducting raids and establishing settlements across the North Sea world. Over time, the Danes transitioned from raiders to kingdom builders, forming one of the earliest centralized Scandinavian states.#!"

 game_concept_svear: "Svear"
 game_concept_svears: "Svears"
 game_concept_svears_main: ""
 game_concept_svears_main_desc: "#F The Svears, or Swedes, were a North $germanic_noun$ people who dominated central Sweden during the early medieval period. They played a crucial role in the expansion of Norse influence into the east, with many Svears participating in trade and warfare along the Baltic and Russian river networks. Over time, they united with the Geats, forming the medieval Swedish kingdom.#!"

 game_concept_west_germanic: "West $germanic_noun$"
 game_concept_west_germans: "West Germans"
 game_concept_west_germans_main: ""
 game_concept_west_germans_main_desc: "#F The West Germans were a broad cultural group that encompassed various $germanic_noun$ tribes west of the Elbe River. Among them were the $frankish_collective_noun$, $old_saxon_collective_noun$, and other related peoples who formed the backbone of early medieval European states. Their cultural and linguistic legacy heavily influenced the development of later German, Dutch, and English identities.#!"

 game_concept_saxon: "$old_saxon$"
 game_concept_saxons: "$old_saxon_collective_noun$"
 game_concept_saxons_main: ""
 game_concept_saxons_main_desc: "#F The $old_saxon_collective_noun$ were a warlike $germanic_noun$ people who inhabited the North Sea coastlines of present-day Germany and the Netherlands. Their seafaring nature led them to raid and later settle in Britain during the early medieval period, forming the foundation of $anglo_saxon$ England. Those who remained on the continent eventually fell under the rule of the Carolingians but retained a distinct identity well into the medieval era.#!"

 game_concept_frankish: "Frankish"
 game_concept_frank: "Frank"
 game_concept_franks: "$frankish_collective_noun$"
 game_concept_franks_main: ""
 game_concept_franks_main_desc: "#F The $frankish_collective_noun$ were a powerful $germanic_noun$ people who rose to prominence in the late $roman$ period. Initially a tribal confederation, they eventually established the $frankish$ Kingdom, which evolved into the Carolingian Empire. Their conquests laid the foundation for medieval France and Germany, and their legacy endured through both the Holy $roman$ Empire and the later French state.#!"

 game_concept_anglish: "Anglish"
 game_concept_angle: "Angle"
 game_concept_angles: "Angles"
 game_concept_angles_main: ""
 game_concept_angles_main_desc: "#F The Angles were a $germanic_noun$ people who originated from northern Germany and later migrated to Britain during the early medieval period. Alongside the $old_saxon_collective_noun$ and Jutes, they played a key role in the formation of $anglo_saxon$ England. Their name lives on in England, which derives from Angle-land, reflecting their lasting impact on British history.#!"

 game_concept_jute: "Jute"
 game_concept_jutes: "Jutes"
 game_concept_jutes_main: ""
 game_concept_jutes_main_desc: "#F The Jutes were a lesser-known $germanic_noun$ group who, like the Angles and $old_saxon_collective_noun$, migrated to Britain in the early medieval period. Though their independent identity faded over time, they contributed to the formation of early English culture and society, particularly in regions such as Kent.#!"

 game_concept_west_saxon: "Wessex (West $old_saxon$)"
 game_concept_west_saxons: "Wessex (West $old_saxon_collective_noun$)"
 game_concept_east_saxon: "Essex (East $old_saxon$)"
 game_concept_east_saxons: "Essex (East $old_saxon_collective_noun$)"
 game_concept_south_saxon: "Sussex (South $old_saxon$)"
 game_concept_south_saxons: "Sussex (South $old_saxon_collective_noun$)"
 game_concept_britannian_saxon: "$britannian_noun$ $old_saxon$"
 game_concept_britannian_saxons: "$britannian_noun$ $old_saxon_collective_noun$"
 game_concept_britannian_saxons_main: ""
 game_concept_britannian_saxons_main_desc: "#F The $britannian_noun$ $old_saxon_collective_noun$ were a collection of early medieval $anglo_saxon$ polities that emerged in southern Britain following the collapse of $roman$ rule. These groups, primarily consisting of West $old_saxon_collective_noun$, East $old_saxon_collective_noun$, and South $old_saxon_collective_noun$, played a crucial role in shaping the early political landscape of post-$roman$ Britain.\n\nThe West $old_saxon_collective_noun$, centered in Wessex, were initially one of many competing $anglo_saxon$ kingdoms. However, under rulers such as Alfred the Great, they gradually expanded their influence, becoming the dominant force in the unification of England.\n\nThe East $old_saxon_collective_noun$, based in Essex, were a smaller but significant $old_saxon$ polity situated along the Thames estuary. While frequently influenced by their larger neighbors, they retained a degree of autonomy before being absorbed into the growing power of Wessex.\n\nThe South $old_saxon_collective_noun$, or Sussex, occupied the coastal lands of southern Britain. They were among the earliest $old_saxon$ settlers in the region but remained relatively isolated compared to their northern counterparts. Their kingdom eventually fell under the rule of Wessex during the late VIIIth century.\n\nBy the late IXth century, the $britannian_noun$ $old_saxon_collective_noun$ had largely consolidated under the rule of the West $old_saxon$ monarchy, marking the transition from a fractured collection of $old_saxon$ kingdoms into a unified English identity. Characterized by their $germanic_noun$ warrior traditions, early Christianization, and expansionist ambitions, the $britannian_noun$ $old_saxon_collective_noun$ formed the foundation of medieval England.#!"

 game_concept_east_germanic: "East $germanic_noun$"
 game_concept_east_germans: "East Germans"
 game_concept_east_germans_main: ""
 game_concept_east_germans_main_desc: "#F The East Germans were a grouping of $germanic_noun$ tribes who migrated from Scandinavia and the Baltic region toward the east and south. Among them were the Goths, Vandals, and Burgundians, who played a key role in the fall of the Western $roman$ Empire and the establishment of various post-$roman$ kingdoms.#!"

 game_concept_gothic: "Gothic"
 game_concept_goth: "Goth"
 game_concept_goths: "Goths"
 game_concept_goths_main: ""
 game_concept_goths_main_desc: "#F The Goths, colloquially also known as the Visigoths, Ostrogoths and Tetraxites (Crimean Goths), are an East $germanic_noun$ people that hailed from the northern shores of the Black Sea.\n\nWhile their origin can probably be traced back to the Vistula and possibly even Scandinavia, concrete evidence of a distinct Gothic people only emerges after the Tervingi and Greuthungi crossed the Danube into $roman$ territory during the IVth century. Following a series of conflicts between the Romans and Huns, and amidst various $roman$ Civil Wars, the Goths established their own kingdoms in Gaul, later Iberia, and Italy. While the Goths assimilated into wider $roman$ culture for the most part, they nevertheless left their mark on the mediterranean landscape for centuries, especially so in Iberia and Southern France where Visigothic Laws persisted way into the Xth century and beyond.\n\nCharacterized by their East $germanic_noun$ language and their East $germanic_noun$ heritage, the Goths have long been assimilated and can now only be found in Crimea.#!"

 game_concept_visigothic: "Visigothic"
 game_concept_visigoth: "Visigoth"
 game_concept_visigoths: "Visigoths"
 game_concept_visigoths_main: ""
 game_concept_visigoths_main_desc: "#F The Visigoths were a branch of the Gothic people who famously sacked Rome in 410$GAME_DATE_STRING_ERA_CE$ before settling in Gaul and later Iberia. They established the Visigothic Kingdom, which dominated the Iberian Peninsula until the Muslim conquest in the VIIIth century.#!"

 game_concept_ostrogothic: "Ostrogothic"
 game_concept_ostrogoth: "Ostrogoth"
 game_concept_ostrogoths: "Ostrogoths"
 game_concept_ostrogoths_main: ""
 game_concept_ostrogoths_main_desc: "#F The Ostrogoths were a branch of the Gothic people who settled in the Balkans and later established a kingdom in Italy after the fall of the Western $roman$ Empire. Their rule was short-lived, as they were ultimately conquered by the Byzantines in the VIth century.#!"

 game_concept_vandal: "Vandal"
 game_concept_vandals: "Vandals"
 game_concept_vandals_main: ""
 game_concept_vandals_main_desc: "#F The Vandals were an East $germanic_noun$ people who migrated through Gaul and Iberia before establishing a powerful kingdom in North Africa. They famously sacked Rome in 455$GAME_DATE_STRING_ERA_CE$, and their rule lasted until the Byzantines reconquered their territory in the VIth century.#!"

 game_concept_burgundian: "Burgundian"
 game_concept_burgundians: "Burgundians"
 game_concept_burgundians_main: ""
 game_concept_burgundians_main_desc: "#F The Burgundians were an East $germanic_noun$ people who settled in Gaul, forming the Kingdom of Burgundy. Though later absorbed into the $frankish$ realm, their name and cultural influence endured in the region of Burgundy.#!"

 game_concept_caucasianized: "Caucasianized"
 game_concept_caucasian: "Caucasian"
 game_concept_caucasians: "Caucasians"
 game_concept_caucasians_main: ""
 game_concept_caucasians_main_desc: "#F The Local Caucasians were the indigenous peoples of the Caucasus, inhabiting the region since prehistoric times. They include a wide array of ethnic groups, such as the Hurrians, Urartians, and later the various Nakh-Dagestani and Kartvelian-speaking peoples.\n\nThroughout history, the Caucasus served as a cultural and political crossroads between the Near East, the Eurasian steppes, and the $iranian_noun$ plateau. The Local Caucasians developed advanced political structures, such as the Kingdom of Urartu, and maintained distinct linguistic traditions that survive to this day among modern Caucasian peoples.\n\nDespite repeated invasions by Persians, Greeks, Romans, and later Islamic empires, the Local Caucasians retained their unique identities through mountain fortresses, decentralized clan-based societies, and a deep-rooted warrior ethos. Characterized by their linguistic diversity, resilience, and strategic geopolitical position, the Local Caucasians have remained an integral part of the region's historical landscape.#!"

 game_concept_proto_tocharian: "Proto-Tocharian"
 game_concept_proto_tocharians: "Proto-Tocharians"
 game_concept_afanasievo: "Afanasievo"
 game_concept_afanasievo_main: ""
 game_concept_afanasievo_main_desc: "#F The Afanasievo were an early Bronze Age culture that flourished in the Minusinsk Basin and the Altai Mountains during the IIIrd millennium$GAME_DATE_STRING_ERA_BCE$. As one of the earliest known steppe cultures in Central Asia, the Afanasievo are often considered a easternmost offshoot of the broader Yamnaya expansion, sharing many cultural and genetic ties with the Indo-European heartlands to the west.\n\nThough their direct influence waned by the late Bronze Age, many scholars theorize that the Afanasievo played a crucial role in the formation of the Tocharian peoples, who later emerged as the easternmost branch of the Indo-European linguistic family. The connection between the two is primarily supported by linguistic and genetic evidence, which suggests that the Tocharian languages of the Tarim Basin may have originated from Afanasievo settlers moving southward into the oases of what is now Xinjiang.\n\nCharacterized by their pastoralist traditions and early steppe influence, the Afanasievo serve as a critical link between the Proto-Indo-European expansion and the later emergence of the Tocharian civilizations in Central Asia." #\n\n\n#T Related $game_concept_ancestral_communities$#!\n[subeshi|L], [scythians|L]

 game_concept_yuezhi_origin: ""
 game_concept_yuezhi_origin1: "mixed"
 game_concept_yuezhi_origin_desc: ""

 game_concept_arya: "Arya"
 game_concept_indo: "Indo"
 game_concept_indo_aryan: "$indo_aryan_noun$"
 game_concept_indo_aryans: "$indo_aryan_noun$s"
 game_concept_indo_aryans_main: ""
 game_concept_indo_aryans_main_desc: "#F The $indo_aryan_noun$s were a group of Indo-European peoples who migrated into the Indian subcontinent during the late Bronze Age, forming the linguistic and cultural foundation for many of the historical and modern populations of South Asia. Originating from the Eurasian steppe, they are commonly associated with the Andronovo, Sintashta, and BMAC (Bactria-Margiana Archaeological Complex) cultures, which played a crucial role in their migration and eventual settlement in the region\n\nBy the early IInd millennium$GAME_DATE_STRING_ERA_BCE$, the $indo_aryan_noun$s had begun their movement southward through Central Asia, bringing with them their distinct Indo-European language, religious traditions, and social structures. Their influence is most clearly seen in the Rigvedic texts, which describe a society structured around warrior chieftains, ritual sacrifices, and a complex pantheon that would later evolve into the foundations of Hinduism.\n\nCharacterized by their steppe heritage and early interaction with the indigenous cultures of the subcontinent, the $indo_aryan_noun$s serve as the crucial link between the broader Indo-European world and the later development of Vedic civilization in South Asia.#!"

 game_concept_daylamite: "Daylamite"
 game_concept_iranianized: "$iran_noun$ianized"
 game_concept_iranian: "$iranian_noun$"
 game_concept_iranians: "$iran_noun$ians"
 game_concept_iranians_main: ""
 game_concept_iranians_main_desc: "#F The $iran_noun$ians, colloquially also known as the Sasanians, or sometimes simply and mistakenly known as 'Persians', were the inhabitants of the Sassanid Empire that dominated $iran_noun$ from the IIIrd century until the VIIth century. The House of Sasan arose from the historical province of Pars and would, in the IIIrd century, overthrow the Arsacid Parthians that had ruled $iran_noun$ up until that point, thus giving rise to the Sassanid Empire that would come to dominate the plateau for the next four centuries. Styling itself as a restored Achaemenid Empire, even coming close to re-establishing the historical boundaries during the final Sassanid-Byzantine war, the Sassanid Empire was eventually left weakened after decades of war and thus became an easy target for the early Islamic Caliphate. In the aftermath of the Islamic Conquest of $iran_noun$, the many peoples of the former empire began to slowly convert to the new religion, giving rise to new native $iranian_noun$ dynasties such as the Saffarids or Samanids during the $iranian_noun$ Intermezzo. Apart from being the main force behind the integration of Khwarazm and Sogdiana into the $iranian_noun$ sphere, these dynasties were also patrons of the culture and arts that gave rise to the Islamic-Persian cultural fusion. Characterized by their $iranian_noun$ heritage and various $iranian_noun$ languages such as Persian, Khwarazmian, or Caspian, the many descendants of the $iran_noun$ians still form the dominant group on the $iran_noun$ians plateau and in Central Asia.#!"

 game_concept_pars: "Pars"
 game_concept_pars_main: ""
 game_concept_pars_main_desc: "#F The Pars, or Old Persians, were an ancient $iranian_noun$ people from the southwestern $iranian_noun$ plateau, in a region known as Parsa (modern Fars). As speakers of Old Persian, they rose to prominence in the early Ist millennium$GAME_DATE_STRING_ERA_BCE$, ultimately establishing the Achaemenid Empire under Cyrus the Great. This empire, expanded by rulers like Darius I and Xerxes, stretched from the Aegean to the Indus and was known for its administrative innovation, road systems, and relative tolerance.\n\nEven after its fall to Alexander the Great in the IVth century$GAME_DATE_STRING_ERA_BCE$, Persian identity endured under Hellenistic and Parthian rule. In the IIIrd century$GAME_DATE_STRING_ERA_CE$, the Sasanian dynasty—claiming descent from the old Pars—revived many Achaemenid ideals, including centralized governance, Zoroastrian state religion, and imperial symbolism. Titles like $emperor_feudal_male_iranian_group$ (King of Kings) and renewed monumental architecture echoed their forebears.\n\nThe Pars left a lasting legacy in imperial culture, governance, and religion, becoming a foundational force in the shaping of $iranian_noun$ and broader Near Eastern history.#!"

 game_concept_scytho_sarmatian: "Scytho-Sarmatian"
 game_concept_scytho_sarmatians: "Scytho-Sarmatians"
 game_concept_scytho_sarmatians_main: ""
 game_concept_scytho_sarmatians_main_desc: "#F The Scytho-Sarmatians, also known as Scythians, Sarmatians or Saka, are an ancient people who historically inhabited the steppes of Eurasia, living as far west as Pannonia and as far east as Zhetysu. During the migration age, many tribes such as the Taifals or Alans moved into the $roman$ Empire, setting up their own kingdoms along with $germanic_noun$ groups such as the Vandals in North Africa. In the aftermath of these migrations, Scytho-Sarmatians who were left behind gradually assimilated into new emergent groups such as the various $turk$ic or $slavic$ peoples, though some remain such as the Alans of the Caucasus or the Saka of the Tarim Basin. Characterized by their Serindian and Sarmatian heritage, as well as their various $iranian_noun$ languages such as Alanian, Sogdian or Saka, the Scytho-Sarmatians are primarily found in Alania, Kashgar, Khotan, as well as in various pockets throughout India.#!"

 game_concept_scythian: "Scythian"
 game_concept_scythians: "Scythians"
 game_concept_scythians_main: ""
 game_concept_scythians_main_desc: "#F The Scythians were a nomadic people who dominated the Caspian-Pontic steppe from the VIIth century$GAME_DATE_STRING_ERA_BCE$ onwards. Originating from the broader $iranian_noun$ steppe culture, they were known for their mastery of mounted warfare, which made them formidable adversaries to the great empires of the ancient world, including the Achaemenid Persians and the Greeks.\n\nAt the height of their power, the Scythians controlled a vast expanse of land stretching from the Danube to the Altai Mountains, operating as both raiders and traders along the Silk Road. Their society was organized into loosely connected tribal confederations, with an elite warrior class that maintained influence through military prowess.\n\nThe Scythians' legacy endured long after their political decline, as many of their traditions were inherited by later steppe peoples such as the Sarmatians and Alans. Their artistic style, particularly in goldwork, became one of the most distinctive elements of ancient Eurasian culture. Characterized by their nomadic lifestyle, composite bows, and intricate burial mounds, the Scythians played a defining role in the history of the Eurasian steppes.#!"

 game_concept_cimmerian: "Cimmerian"
 game_concept_cimmerians: "Cimmerians"
 game_concept_cimmerians_main: ""
 game_concept_cimmerians_main_desc: "#F The Cimmerians were a nomadic people of the Eurasian steppe, first recorded in the early Ist millennium$GAME_DATE_STRING_ERA_BCE$. They are believed to have originated from early Thracian tribes in the Pontic steppe before being displaced by the Scythians forcing them into Anatolia and the Near East.\n\nIn Anatolia, the Cimmerians played a disruptive role, sacking cities such as Sardis and threatening the stability of the Neo-Assyrian Empire. However, by the VIIth century$GAME_DATE_STRING_ERA_BCE$, their power had waned, and they were either assimilated by the local populations or pushed further into obscurity by rising powers such as the Medes and Lydians.\n\nDespite their brief historical prominence, the Cimmerians were among the first recorded steppe nomads and laid the groundwork for the military and cultural patterns that would later define the Sarmatians.#!"

 game_concept_sarmato: "Sarmato"
 game_concept_sarmatian: "Sarmatian"
 game_concept_sarmatians: "Sarmatians"
 game_concept_sarmatians_main: ""
 game_concept_sarmatians_main_desc: "#F The Sarmatians were an Scythian originated steppe people who succeeded the Cimmerians as the dominant force on the Pontic steppe from the IInd century$GAME_DATE_STRING_ERA_BCE$ onwards. Known for their heavy cavalry, they were among the first to develop fully armored lancers, a tactic that would later influence both $roman$ and medieval European warfare.\n\nUnlike the more fragmented Scythians, the Sarmatians often operated as larger, more unified tribal confederations. They expanded westward into the Carpathian Basin and frequently clashed with the $roman$ Empire, at times serving as both mercenaries and adversaries.\n\nBy the early medieval period, many Sarmatian groups had been absorbed into the emerging Gothic and $slavic$ cultures, though some, such as the Alans, continued to play a major role in both the Western and Eastern $roman$ worlds. Characterized by their warrior ethos, cavalry traditions, and artistic influences on later steppe cultures, the Sarmatians left an enduring mark on European and Eurasian history.#!"

 game_concept_massagetae: "Massagetae"
 game_concept_massagetaes: "Massagetaes"
 game_concept_massagetaes_main: ""
 game_concept_massagetaes_main_desc: "#F The Massagetae were a nomadic people who inhabited the vast steppes of Central Asia, particularly around the region of the Caspian Sea and the Syr Darya River. Closely related to the broader Scythian and Saka groups, they were known for their fierce warrior culture, mobile lifestyle, and expert horsemanship.\n\nFamed for their resistance against the Achaemenid Persian Empire, the Massagetae came into historical prominence when their queen, Tomyris, led her warriors to victory against Cyrus the Great in the VIth century$GAME_DATE_STRING_ERA_BCE$. Their society was deeply tied to the nomadic traditions of the steppe, with a strong emphasis on warfare, archery, and pastoralism. Like other steppe peoples, they lived in tribal confederations, often raiding or trading with their sedentary neighbors.\n\nOver time, the Massagetae gradually assimilated into other steppe cultures, contributing to the ethnogenesis of later $iranian_noun$, $turk$ic, and other nomadic groups that dominated the region in subsequent centuries. Characterized by their steppe heritage and warrior ethos, the Massagetae played a significant role in shaping the history of Central Asia.#!"

 game_concept_saka: "Saka"
 game_concept_sakas: "Sakas"
 game_concept_sakas_main: ""
 game_concept_sakas_main_desc: "#F The Sakas were an $iranian_noun$ nomadic group closely related to the Scythians, inhabiting the vast steppes of Central Asia. Unlike their western cousins, the Sakas migrated eastward, settling in regions such as Sogdiana, the Tarim Basin, and even parts of the Indian subcontinent.\n\nDivided into various subgroups, including the Indo-Scythians, the Sakas played a crucial role in the cultural exchanges between Central Asia, Persia, and India. Some groups established kingdoms in present-day Pakistan and India, influencing local art, warfare, and religion.\n\nOver time, the Sakas assimilated into surrounding cultures, particularly within the Kushan Empire, but their steppe traditions and warrior aristocracy left a lasting impact on the history of the region.#!"

 game_concept_chorasmian: "Chorasmian"
 game_concept_chorasmians: "Chorasmians"
 game_concept_chorasmians_main: ""
 game_concept_chorasmians_main_desc: "#F The Chorasmians were an ancient $iranian_noun$ people who inhabited the region of Khwarezm, a fertile area along the Amu Darya River. Mentioned in Achaemenid and later Persian sources, they were known for their complex irrigation networks and trading hubs, which linked Central Asia to the $iranian_noun$ plateau.\n\nThough politically subordinate to larger empires at various points, such as the Achaemenids and later the Sassanids, the Chorasmians maintained a distinct identity well into the medieval period. Their legacy endured in the form of the Khwarazmian dynasty, which would later become a major power in the Islamic era.#!"

 game_concept_pactyran: "Pactyan"
 game_concept_pactyrans: "Pactyans"
 game_concept_pactyrans_main: ""
 game_concept_pactyrans_main_desc: "#F The Pactyans were an ancient people who inhabited the eastern $iranian_noun$ plateau, particularly in the regions corresponding to modern Afghanistan and Pakistan. Mentioned in Achaemenid records, they were likely part of the broader $iranian_noun$ tribal network that contributed to the ethnogenesis of later Pashto-speaking peoples.\n\nAs part of the Achaemenid Empire, the Pactyans played a role in the administration and military of the Persian world, but little is known about their independent political structures. Over time, their identity faded as they merged with other $iranian_noun$ and $indo_aryan_noun$ groups in the region.#!"

 game_concept_parni: "Parnean"
 game_concept_parni_main: ""
 game_concept_parni_main_desc: "#F The Parneans were a nomadic tribe from the Central Asian steppes who would later establish the Parthian Empire. Originally one of many steppe confederations, they migrated southward into $iran_noun$ during the IIIrd century$GAME_DATE_STRING_ERA_BCE$, overthrowing Seleucid rule and founding what would become one of the dominant powers of the ancient world.\n\nParthian society was a blend of steppe military traditions and Hellenistic administration, with the Parnean ruling elite adopting elements of both $iranian_noun$ and Greek culture. The empire they built lasted for nearly five centuries before being supplanted by the Sassanids.#!"

 game_concept_cadusian: "Cadusian"
 game_concept_cadusi: "Cadusi"
 game_concept_cadusi_main: ""
 game_concept_cadusi_main_desc: "#F The Cadusi were an ancient people of northwestern $iran_noun$, known for their fierce independence and frequent conflicts with the Achaemenid and later Seleucid Empires. Their mountainous homeland provided a natural barrier against larger imperial forces, allowing them to maintain a degree of autonomy.\n\nAlthough little is known about their language or precise ethnic origins, they are often linked to other $iranian_noun$ tribal groups that later contributed to the Kurdish and Caspian peoples of the region.#!"

 game_concept_subeshi: "Subeshi"
 game_concept_subeshi_main: ""
 game_concept_subeshi_main_desc: "#F The Subeshi were an early Bronze Age culture of the Tarim Basin, closely associated with the migration of Indo-European peoples into western China. Excavations of their burial sites have revealed mummified remains with distinct Caucasoid features, suggesting an early Indo-European presence in the region.\n\nThey are often linked to the later Tocharian peoples, who would go on to establish flourishing oasis cities along the Silk Road. Their existence provides crucial evidence for the western influence on the early development of Central Asian civilization." #\n\n\n#T Related $game_concept_ancestral_communities$#!\n[afanasievo|L], [scythians|L]

 game_concept_chust: "Chust"
 game_concept_chust_main: ""
 game_concept_chust_main_desc: "#F The Chust culture was an early Iron Age culture that flourished in Central Asia, particularly in the Fergana Valley, during the IInd and Ist millennia$GAME_DATE_STRING_ERA_BCE$. It is closely associated with the early Indo-$iranian_noun$ migrations and played a key role in the development of later $iranian_noun$ steppe traditions.\n\nArchaeological evidence suggests that the Chust culture was characterized by advanced agricultural practices, fortified settlements, and a mixed economy that included pastoralism and metallurgy. Many scholars link the Chust culture to the ancestors of the Saka and other $iranian_noun$ steppe peoples, given their burial practices and material culture similarities.\n\nAs new waves of nomadic expansions reached Central Asia, the Chust culture was gradually assimilated into emerging steppe polities. Characterized by its transitional nature between sedentary and nomadic lifestyles, the Chust culture serves as a key link in the ethno-linguistic development of the early steppe world." #\n\n\n#T Related $game_concept_ancestral_communities$#!\n[sogdians|L], [scythians|L]

 game_concept_aramean: "Aramean"
 game_concept_arameans: "Arameans"
 game_concept_arameans_main: ""
 game_concept_arameans_main_desc: "#F The Arameans were a Semitic people who emerged in the Levant during the early Ist millennium$GAME_DATE_STRING_ERA_BCE$. Their language, Aramaic, spread rapidly and eventually replaced Akkadian as the lingua franca of the Near East.\n\nThe Aramean identity persisted even after the fall of their independent kingdoms, influencing later groups such as the Syriacs and various Christian communities of Mesopotamia. Today, their linguistic and cultural legacy endures in the form of modern Syriac-speaking peoples.#!"

 game_concept_neo_aramean: "Neo-Aramean"
 game_concept_neo_arameans: "Neo-Arameans"
 game_concept_neo_arameans_main: ""
 game_concept_neo_arameans_main_desc: "#F The Neo-Arameans, also known as Syrians or Syriacs, were an ancient people hailing from Aram located in the Levant. During the time of the Assyrian Empire, the Aramaic language would gradually spread into Mesopotamia, replacing the old Akkadian languages once spoken there.\n\nThroughout the post-Assyrian period, the various Aramaic speaking peoples would gradually fall under the influence of neighboring empires, namely those of the $iran_noun$ians and Romans, causing them to gradually diverge in culture.\n\nCharacterized by their Aramean heritage and shared Aramaic language, the descendants of the Arameans continue to live on in form of the Syriacs, Assyrians, as well as in the Mandean Community.#!"

 game_concept_chaldean: "Chaldean"
 game_concept_chaldeans: "Chaldeans"
 game_concept_chaldeans_main: ""
 game_concept_chaldeans_main_desc: "#F The Chaldeans were a Semitic people who played a major role in the history of Babylonia. Originally a tribal group inhabiting the marshlands of southern Mesopotamia, they gradually gained influence, culminating in the foundation of the Neo-Babylonian Empire in the VIIth century$GAME_DATE_STRING_ERA_BCE$.\n\nTheir rule saw the height of Babylonian civilization, including the construction of the famous Hanging Gardens. However, after their defeat by the Achaemenid Persians, they were gradually assimilated into the wider Mesopotamian population.#!"

 game_concept_athoraya: "Asorian"
 game_concept_athorayas: "Asorians"
 game_concept_athorayas_main: ""
 game_concept_athorayas_main_desc: "#F The Asorians were an ancient people of Mesopotamia, better known as the inhabitants of the Assyrian Empire. Rising to prominence in the IInd millennium$GAME_DATE_STRING_ERA_BCE$, they established one of the first great imperial powers of the Near East, dominating the region through their advanced military tactics and administrative systems.\n\nEven after the fall of the Neo-Assyrian Empire, the Asorians maintained their distinct identity, persisting as a cultural and linguistic community throughout Mesopotamian history.#!"

 game_concept_bedouin: "$bedouin$"
 game_concept_bedouins: "$bedouin$"
 game_concept_arabized: "Arabized"
 game_concept_arabic: "Arabic"
 game_concept_arab: "Arab"
 game_concept_arabs: "Arabs"
 game_concept_arabs_main: ""
 game_concept_arabs_main_desc: "#F The Arabs are the descendants of various Arabian peoples who were most recently united under the banner of Islam.\n\nWhile they were disunited for much of their history, their recently achieved unification in the VIIth century under the banner of the Rashidun Caliphate allowed them to conquer much of the known world. Over the course of a mere century, the Arabs had managed to assert their rule over lands as far west as Hispania and as far east as Khorasan. With the spread of the new religion, the Arabic language and culture, reinforced by migration and assimilation, began to spread and diverge across the vast Islamic Empires, eventually giving rise to various new cultures in the process.\n\nCharacterized by their Arabic language and their Arabic heritage, the Arabs exist primarily within the Arabian Peninsula but can also be found in substantial numbers in Mesopotamia, the Levante and the Maghreb.#!"

 game_concept_judah: "Judah"
 game_concept_benjamin: "Benjamin"
 game_concept_israelite: "Israelite"
 game_concept_israelites: "Israelites"
 game_concept_israelites_main: ""
 game_concept_israelites_main_desc: "#F The Israelites trace their origins to the patriarch Jacob, also known as Israel, who according to tradition had twelve sons. These sons became the eponymous ancestors of the Twelve Tribes of Israel: Reuben, Simeon, Levi, Judah, Dan, Naphtali, Gad, Asher, Issachar, Zebulun, Joseph (whose two sons, Ephraim and Manasseh, were often counted in his place), and Benjamin. These tribes formed the backbone of ancient Israelite society, each associated with a specific territory in the Land of Israel during the period of the united monarchy and afterward.\n\nHowever, over time, most of these tribes disappeared from history. Following the Assyrian conquest of the Kingdom of Israel in the late VIIIth century$GAME_DATE_STRING_ERA_BCE$, ten of the northern tribes were exiled and assimilated into the broader Assyrian empire. These have since become known as the Ten Lost Tribes. Their fate remains uncertain, and various legends and theories have arisen around them throughout history.\n\nOnly the tribes of Judah and Benjamin, which formed the core of the southern Kingdom of Judah, remained politically and culturally intact. These two tribes were not exiled during the Assyrian conquest and instead endured until the Babylonian exile in the VIth century$GAME_DATE_STRING_ERA_BCE$. Even after the Babylonian captivity, members of these tribes returned and reestablished their religious and cultural institutions in Jerusalem. The Levites, though not counted among the twelve land-holding tribes, also continued to function in religious roles alongside Judah and Benjamin.\n\nAs a result, modern Jewish identity is primarily descended from the tribes of Judah, Benjamin, and Levi, with Judah being the dominant identity—so much so that the term “Jew” (from Yehudi, meaning “of Judah”) became the standard designation for the people as a whole. This historical narrowing of tribal identity is largely due to the geopolitical divisions, successive conquests, and the survival of only the southern kingdom and its descendants.#!"

 game_concept_adnanite: "Adnanite"
 game_concept_adnanites: "Adnanites"
 game_concept_adnanites_main: ""
 game_concept_adnanites_main_desc: "#F The Adnanites were a group of ancient Arab tribes that traced their lineage back to Adnan, a legendary ancestor believed to be a descendant of Ishmael. They were primarily concentrated in northern and central Arabia, forming the cultural and political foundation of many later Arab societies. The Adnanites played a crucial role in pre-Islamic Arabian history, engaging in trade, warfare, and alliances with neighboring tribes and empires. Characterized by their Arab heritage and strong tribal traditions, the Adnanites laid the groundwork for the emergence of later Arab polities.#!"

 game_concept_sabaean: "Sabaean"
 game_concept_sabaeans: "Sabaeans"
 game_concept_sabaeans_main: ""
 game_concept_sabaeans_main_desc: "#F The Sabaeans were an ancient South Arabian civilization that flourished in modern-day Yemen between the IXth century$GAME_DATE_STRING_ERA_BCE$ and the IIIrd century. They were known for their sophisticated irrigation systems, extensive trade networks, and monumental architecture. The Sabaeans worshipped a pantheon of deities, with Almaqah as their chief god, and their kingdom was centered around the capital city of Marib. Over time, their culture and language influenced the broader Arabian Peninsula, especially through trade with the Levant and Africa. Characterized by their South Arabian heritage and mercantile traditions, the Sabaeans played a pivotal role in the history of ancient Arabia.#!"

 game_concept_dilmun: "Dilmun"
 game_concept_dilmuns: "Dilmuns"
 game_concept_dilmuns_main: ""
 game_concept_dilmuns_main_desc: "#F The Dilmuns were an ancient civilization centered in present-day Bahrain and the eastern coast of the Arabian Peninsula. Flourishing from the IIIrd millennium$GAME_DATE_STRING_ERA_BCE$, they were a key trading hub between Mesopotamia, the Indus Valley, and Arabia. The Dilmun civilization was known for its advanced maritime trade, pearl diving, and religious significance in Mesopotamian texts, where it was often depicted as a land of purity and abundance. Characterized by their seafaring traditions and mercantile prowess, the Dilmuns played a crucial role in the early trade networks of the ancient Near East.#!"

 game_concept_elamite: "Elamite"
 game_concept_elamites: "Elamites"
 game_concept_elamites_main: ""
 game_concept_elamites_main_desc: "#F The Elamites were the last known phase of the Elamite civilization, thriving in the southwestern $iranian_noun$ plateau between the IXth and VIth centuries$GAME_DATE_STRING_ERA_BCE$. Despite their decline in power following the collapse of the earlier Elamite kingdoms, they maintained a distinct political and cultural presence, often resisting Assyrian and later Persian expansion.\n\nThe Elamites are known for their complex relationship with the Neo-Assyrian Empire, alternately acting as its rivals and vassals. Despite repeated invasions by Assyrian kings such as Ashurbanipal, they managed to retain a degree of autonomy until the rise of the Achaemenid Persians, who ultimately absorbed Elamite lands into their empire.\n\nWhile the Elamite language and identity gradually faded under Persian rule, elements of their administrative and artistic traditions influenced the Achaemenid court. Characterized by their $iranian_noun$ heritage, resilience against imperial expansion, and rich artistic traditions, the Elamites were among the last representatives of an ancient and influential civilization.#!"

 game_concept_amazigh: "Amazigh"
 game_concept_amazighs: "Amazighs"
 game_concept_berberic: "Berberic"
 game_concept_berber: "Berber"
 game_concept_berbers: "Berbers"
 game_concept_berbers_main: ""
 game_concept_berbers_main_desc: "#F The Berbers, known to the Romans as the Mauri and Numidians, are the indigenous people of North Africa, inhabiting the vast region stretching from the Atlantic coast to the borders of Egypt and from the Mediterranean to the depths of the Sahara. Their origins trace back to the earliest human settlements in the Maghreb, where they developed complex societies long before the rise of external empires.\n\nBy the Ist millennium$GAME_DATE_STRING_ERA_BCE$, Berber groups such as the Garamantes of the Sahara and the Numidians of modern Algeria had established powerful tribal confederations, often interacting with Carthaginian, $roman$, and later Byzantine rulers. While some Berbers became integrated into Mediterranean trade and politics, others remained fiercely independent, resisting foreign domination from their mountain strongholds and desert oases.\n\nWith the advent of Islam in the VIIth century, many Berbers gradually adopted the new faith, contributing significantly to the early Islamic expansion into Iberia and beyond. However, they also maintained distinct cultural and linguistic traditions, which survived through the medieval period despite Arabization in some regions. The Almoravid and Almohad dynasties, which ruled vast territories across North Africa and Spain, were of Berber origin, demonstrating their continued military and political influence.\n\nCharacterized by their resilient tribal structure, mastery of desert survival, and warrior heritage, the Berbers have remained a defining force in North African history, with their identity enduring through centuries of cultural transformation.#!"

 game_concept_romanized: "$roman$ized"
 game_concept_romance: "$roman$ce"
 game_concept_roman: "$roman$"
 game_concept_romans: "$roman$s"
 game_concept_romans_main: ""
 game_concept_romans_main_desc: "#F The Romans were an originally Latin people that inhabited the city of Rome but who's name and identity came to be adopted by much of the Mediterranean world over the course of the $roman$ Empire's history.\n\nWhile originally, in its narrowest sense, the term $roman$ denoted an inhabitant of the city of Rome, or a descendant of a $roman$ citizen, the very idea of what it meant to be $roman$ became progressively more generalized until in circa 212, $roman$ citizenship was finally granted to all inhabitants of the Empire. Over the course of Rome's history, the label came to denote more so a cultural lifestyle and legal status, rather than an actual ethnic identity, though more often than not it did take on such a form as well.\n\nCharacterized by their Greek or Latin derived languages, as well as their Latin, $frankish$, Iberian, Vlach, Rhaetic or (Eastern) $roman$ heritages, the descendants of the Romans continue to constitute the majority population across much of the mediterranean.#!"

 game_concept_nuragic: "Nuragic"
 game_concept_nuragics: "Nuragics"
 game_concept_nuragics_main: ""
 game_concept_nuragics_main_desc: "#F The Nuragic people were the ancient inhabitants of Sardinia, a Mediterranean island located to the west of the Italian peninsula. Emerging during the Middle Bronze Age in the XVIIIth century$GAME_DATE_STRING_ERA_BCE$, the Nuragic civilization is best known for its distinctive megalithic architecture—particularly the nuraghi, massive stone towers whose purpose remains debated among scholars. \n\nFollowing their initial rise, the Nuragic people maintained a vibrant and independent culture throughout the Late Bronze and Iron Ages. Their society appears to have been organized into tribal chiefdoms, and evidence of metallurgy, seafaring, and complex social structures has been uncovered through archaeological findings. By the time of the Roman annexation of Sardinia in the IIIrd century$GAME_DATE_STRING_ERA_BCE$, Nuragic culture had already undergone substantial transformation, though remnants of it persisted in the island’s mountainous interior for centuries. \n\nCharacterized by their unique stone architecture, insular development, and cultural resilience, the Nuragic Sardinians represent a distinct branch of the broader tapestry of ancient Mediterranean civilizations.#!"

 game_concept_rn_norses: "Norses"
 game_concept_rn_norse: "Norse"
 game_concept_rn_east_slavs: "East Slavs"
 game_concept_rn_eastslavic: "East Slavic"
 game_concept_rusA: "Rus'"
 game_concept_rusnorse: ""
 game_concept_rusnorse_desc: "#F The formation of the Rus' began with the arrival of Norse people, mainly originating from present-day Sweden, settling and ruling along the river-routes between the Baltic and the Black Seas from around the 8th to 11th centuries$GAME_DATE_STRING_ERA_CE$. They formed a state known in modern historiography as Kievan Rus', which was initially a multiethnic society where the ruling Norsemen merged and assimilated with East Slavic, Baltic and Finnic tribes, ending up with Old East Slavic as their common language.#!"

